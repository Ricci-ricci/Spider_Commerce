services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_ORIGIN: "http://localhost:3000"
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: .
      args:
        BACKEND_INTERNAL_URL: "http://backend:4000"
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_INTERNAL_URL: "http://backend:4000"
    depends_on:
      - backend
