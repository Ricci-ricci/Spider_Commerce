name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/ecommerce:latest
            ${{ secrets.DOCKERHUB_USER }}/ecommerce:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USER }}/ecommerce:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> $GITHUB_PATH

      - name: Deploy to Koyeb
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          koyeb service update ecommerce/web \
            --docker ${{ secrets.DOCKERHUB_USER }}/ecommerce:${{ github.sha }} \
            --env DATABASE_URL=${{ secrets.DATABASE_URL }} \
            --env NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }} \
            --env NODE_ENV=production \
          || koyeb service create web \
            --app ecommerce \
            --docker ${{ secrets.DOCKERHUB_USER }}/ecommerce:${{ github.sha }} \
            --ports 3000:http \
            --routes /:3000 \
            --instance-type free \
            --regions fra \
            --env DATABASE_URL=${{ secrets.DATABASE_URL }} \
            --env NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }} \
            --env NODE_ENV=production